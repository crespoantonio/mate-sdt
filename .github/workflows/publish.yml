name: Publish to NPM

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to latest (for OIDC Trusted Publishing & Provenance)
        run: npm install -g npm@latest

      - name: Run Build & Tests
        run: |
          npm run build
          npm test

      - name: Publish to NPM with OIDC Trusted Publishing & Provenance
        run: npm publish --provenance --access public
